name: Update trending dashboard

on:
  schedule:
    # UTC 00:10 = 北京时间 08:10
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-trending
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 固定北京时间，避免 UTC 与本机日期不一致导致快照日期错位
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch trending and build dashboard
        run: python main.py --no-open

      # 自检不通过就不提交，坏数据不会上线
      - name: Self-check (tests + artifacts + browser render)
        run: python selfcheck.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html feed.xml data
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: update trending dashboard $(date +%Y-%m-%d)"
            git push
          fi
